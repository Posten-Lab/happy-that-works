name: Talos mobile release selector
on:
  pull_request:
    paths:
      - 'deploy/mobile/**'
      - '.github/workflows/mobile-release.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/mobile/**'
      - '.github/workflows/mobile-release.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test deploy/mobile/release-plan.test.mjs
