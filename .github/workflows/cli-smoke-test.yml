name: CLI Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'packages/talos-cli/**'
      - 'packages/talos-agent/**'
      - 'packages/talos-server/**'
      - 'packages/talos-wire/**'
      - 'scripts/verify-packed-cli.cjs'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/talos-cli/**'
      - 'packages/talos-agent/**'
      - 'packages/talos-server/**'
      - 'packages/talos-wire/**'
      - 'scripts/verify-packed-cli.cjs'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

jobs:
  packaged-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ahmadposten/talos-wire build
      - run: pnpm --filter talosapp build
      - run: pnpm --filter @ahmadposten/talos-agent build
      - run: pnpm --filter @ahmadposten/talos-server build
      - run: pnpm --filter @ahmadposten/talos-server bundle:webapp
      # Install the local Talos tarballs with a local wire override. The new
      # namespace does not need to be published for this distribution check.
      - run: pnpm verify:packaged
