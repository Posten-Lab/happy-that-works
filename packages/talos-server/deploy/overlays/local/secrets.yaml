apiVersion: v1
kind: Secret
metadata:
  name: talos-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://talos:talos@talos-postgres:5432/talos
  TALOS_MASTER_SECRET: local-dev-secret-not-for-production
  S3_HOST: talos-minio
  S3_PORT: "9000"
  S3_USE_SSL: "false"
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: talos
