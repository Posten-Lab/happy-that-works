apiVersion: v1
kind: Service
metadata:
  name: talos-postgres
spec:
  ports:
    - port: 5432
  selector:
    app: talos-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talos-postgres
  template:
    metadata:
      labels:
        app: talos-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: talos
            - name: POSTGRES_PASSWORD
              value: talos
            - name: POSTGRES_DB
              value: talos
