apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-app
  namespace: talos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: talos-app
  template:
    metadata:
      labels:
        app: talos-app
    spec:
      containers:
      - name: talos-app
        image: talos-web:local
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        startupProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: talos-app
  namespace: talos
spec:
  selector:
    app: talos-app
  ports:
  - port: 3000
    targetPort: 80
  type: ClusterIP
