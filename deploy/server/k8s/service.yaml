# Talos NodePort; allocate a free port and render this template before applying it.
apiVersion: v1
kind: Service
metadata:
  name: talos-server
  namespace: talos
  labels:
    app: talos-server
spec:
  type: NodePort
  selector:
    app: talos-server
  ports:
    - name: http
      port: 3005
      targetPort: 3005
      nodePort: ${TALOS_API_NODE_PORT}
