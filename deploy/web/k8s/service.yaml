# Talos NodePort; allocate a free port and render this template before applying it.
apiVersion: v1
kind: Service
metadata:
  name: talos-web
  namespace: talos
  labels:
    app: talos-web
    tier: frontend
spec:
  type: NodePort
  selector:
    app: talos-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: ${TALOS_WEB_NODE_PORT}
      protocol: TCP
