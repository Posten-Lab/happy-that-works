# Install this HTTP-only configuration before obtaining the Talos certificate.
# Keep it after TLS is enabled so renewals do not alter other sites.
server {
    listen 80;
    server_name talosapp.ai api.talosapp.ai files.talosapp.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/talos-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
