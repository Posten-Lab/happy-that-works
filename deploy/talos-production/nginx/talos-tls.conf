server {
    listen 443 ssl http2;
    server_name talosapp.ai;
    ssl_certificate /etc/letsencrypt/live/talosapp.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talosapp.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://talos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
server {
    listen 443 ssl http2;
    server_name api.talosapp.ai;
    ssl_certificate /etc/letsencrypt/live/talosapp.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talosapp.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://talos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
    }
}
server {
    listen 443 ssl http2;
    server_name files.talosapp.ai;
    ssl_certificate /etc/letsencrypt/live/talosapp.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talosapp.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    add_header Access-Control-Allow-Origin $talos_files_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, x-amz-date, x-amz-content-sha256, x-amz-security-token" always;
    add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Range" always;
    add_header Vary Origin always;
    location / {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://talos_files;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SigV4 covers Host and the object path: preserve both unchanged.
        proxy_set_header Host $host;
        # Apply CORS only at this new edge host, leaving live MinIO untouched.
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
